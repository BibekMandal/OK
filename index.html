<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desi Aakhada</title>
  <meta name="description" content="Desi Aakhada — DESI अखाड़ा. Hindi gym bangers & power anthems." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
  <link rel="dns-prefetch" href="https://s.ytimg.com" />
  <link rel="preload" href="https://www.youtube.com/iframe_api" as="script" />
  <script src="js/playlist.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+Devanagari:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loader" class="loader" aria-live="polite" aria-busy="true">
    <div class="loader__top">
      <p class="loader__brand">
        <span class="loader__desi">DESI</span>
        <span class="loader__hi">अखाड़ा</span>
      </p>
      <p class="loader__hint">Loading your GYM playlist…</p>
    </div>

    <div class="loader__scene" aria-hidden="true">
      <div class="loader__road">
        <span class="loader__dash"></span>
        <span class="loader__dash"></span>
        <span class="loader__dash"></span>
        <span class="loader__dash"></span>
        <span class="loader__dash"></span>
      </div>
      <div class="loader__cycle-wrap">
        <div class="loader__dust" aria-hidden="true">
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
          <span class="loader__grain"></span>
        </div>
        <img src="cycling.svg" alt="" class="loader__cycle" />
      </div>
    </div>
  </div>

  <main class="page">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-bg__art"></div>
      <div class="hero-bg__fade"></div>
    </div>

    <div class="online-badge" aria-live="polite">
      <span class="online-badge__dot">
        <span class="online-badge__ping"></span>
        <span class="online-badge__core"></span>
      </span>
      <span class="online-badge__count" id="online-count">38</span>
      <span class="online-badge__label">online</span>
    </div>

    <div class="social-links">
      <a href="https://open.spotify.com/search/gym%20workout%20hindi" target="_blank" rel="noopener noreferrer" class="social-pill" aria-label="Spotify">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        <span class="social-pill__label">Spotify</span>
        <svg class="social-pill__arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a href="https://music.youtube.com/search?q=hindi+gym+workout" target="_blank" rel="noopener noreferrer" class="social-pill" aria-label="YouTube Music">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
        <span class="social-pill__label">YT Music</span>
        <svg class="social-pill__arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <header class="hero">
      <h1 class="brand" aria-label="Desi Aakhada">
        <span class="brand__line">
          <span class="brand__desi" lang="en">DESI</span>
          <span class="brand__aakhada" lang="hi" aria-hidden="true">अखाड़ा</span>
        </span>
      </h1>
    </header>

    <div class="hero-scene" aria-label="Bench press animation">
      <div class="hero-scene__stage">
        <div class="hero-scene__glow"></div>
        <canvas id="bench-canvas" class="hero-scene__canvas" aria-hidden="true"></canvas>
        <video
          class="hero-scene__video"
          src="assets/barbell-bench-press.mp4"
          autoplay
          loop
          muted
          playsinline
          preload="auto"
          disablepictureinpicture
          aria-hidden="true"
        ></video>
      </div>
    </div>

    <section class="motivation" aria-label="Gym motivation">
      <blockquote class="motivation__quote" id="motivation-text">Dard hoga, dum nahi tootega.</blockquote>
      <button type="button" class="motivation__refresh" id="motivation-refresh" aria-label="New motivation line">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 3v6h-6"/>
        </svg>
        <span>Refresh</span>
      </button>
    </section>

    <div class="player-wrap">
      <div class="player">
        <div class="player__art">
          <div class="player__disc" id="vinyl">
            <img src="https://i.ytimg.com/vi/jFGKJBPFdUA/hqdefault.jpg" alt="" class="player__cover" id="cover-art" />
          </div>
          <span class="player__hole"></span>
        </div>

        <div class="player__body">
          <p class="player__title" id="track-title">GYM Playlist Loading…</p>
          <p class="player__artist" id="track-artist">Press ▶ to start</p>
          <div class="player__seek">
            <div class="player__bar" id="progress-bar" role="slider" tabindex="0" aria-label="Seek">
              <div class="player__track"><div class="player__fill" id="progress-fill"></div></div>
              <div class="player__thumb" id="progress-thumb"></div>
            </div>
            <p class="player__time"><span id="time-current">0:00</span> / <span id="time-total">0:00</span></p>
          </div>
        </div>

        <div class="player__controls">
          <button type="button" class="player__btn" id="btn-prev" aria-label="Previous">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button type="button" class="player__btn player__btn--main" id="btn-play" aria-label="Play" disabled>
            <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button type="button" class="player__btn" id="btn-next" aria-label="Next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="yt-player" class="yt-hidden"></div>
  </main>

  <script src="js/player.js"></script>
  <script src="js/bench-video.js" defer></script>
  <script src="js/motivation.js" defer></script>
</body>
</html>
